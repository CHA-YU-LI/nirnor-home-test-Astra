<section class="fx-video-reveal" data-effect-root aria-label="影片封面點擊播放展示">
  <h2>A moment in motion.</h2>
  <div class="fx-video-window">
    <video
      src="./assets/motion-study.webm"
      controls
      playsinline
      muted
      preload="metadata"
      aria-label="自製幾何形體短片"
    ></video>
    <div class="fx-video-cover" data-cover data-art="2"></div>
    <button class="fx-video-play" data-play aria-label="播放展示影片">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="1em"
        height="1em"
        viewBox="0 0 24 24"
        fill="currentColor"
        aria-hidden="true"
        focusable="false"
      >
        <path d="m8 5 11 7-11 7Z" />
      </svg>
    </button>
  </div>
  <p class="fx-video-caption" data-video-status role="status">自製短片 / 點擊封面開始播放</p>
</section>
