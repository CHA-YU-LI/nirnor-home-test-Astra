<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>實際換頁與淡出淡入</title>
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./demos/page-transition/effect.css" />
  </head>
  <body>
    <main>
      <h1>實際換頁與淡出淡入</h1>
      <p>舊頁先淡出，再淡入新頁；URL 與瀏覽歷史同步改變。</p>
      <section class="fx-page-transition" data-effect-root aria-label="實際換頁與淡出淡入展示">
        <div data-page-view class="fx-page-a">
          <span class="fx-caption">01 / 索引展示</span>
          <div class="fx-page-orb" aria-hidden="true"></div>
          <h2>between<br />two pages.</h2>
          <p>點擊連結，舊畫面淡出後，新畫面接續淡入。</p>
          <a href="page-b.html" data-route>前往作品頁 →</a>
        </div>
        <div class="fx-route-status" data-route-status aria-live="polite">目前頁面：index.html</div>
      </section>
      <p class="package-status" role="status">可操作範例</p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
