<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>混沌粒子流形與形態切換</title>
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./demos/chaos-attractor/effect.css" />
  </head>
  <body>
    <main>
      <h1>混沌粒子流形與形態切換</h1>
      <p>細粒子構成大片流形；跨過 About 分界，平滑變形成另一組吸引子。</p>
      <section class="fx-chaos-attractor" data-effect-root aria-label="混沌粒子流形與形態切換展示">
        <canvas aria-hidden="true"></canvas>
        <div class="fx-scroller" data-scroller tabindex="0" role="region" aria-label="可捲動展示區">
          <div class="fx-field-part">
            <h2>A field<br />of possibilities.</h2>
            <p>捲動跨過下方分界，粒子會變成另一個形態。</p>
          </div>
          <div class="fx-boundary">ABOUT / 形態切換分界</div>
          <div class="fx-field-part">
            <h2>Another<br />point of view.</h2>
            <p>反向捲回即可恢復第一組流形。</p>
          </div>
        </div>
        <button class="fx-action fx-top-action" data-morph>切換形態</button
        ><span class="fx-render-status" data-render-status>正在建立畫面…</span>
      </section>
      <p class="package-status" role="status">可操作範例</p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
