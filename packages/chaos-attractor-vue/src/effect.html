<section class="fx-chaos-attractor" data-effect-root aria-label="混沌粒子流形與形態切換展示">
  <canvas aria-hidden="true"></canvas>
  <div class="fx-scroller" data-scroller tabindex="0" role="region" aria-label="可捲動展示區">
    <div class="fx-field-part">
      <h2>A field<br />of possibilities.</h2>
      <p>捲動跨過下方分界，粒子會變成另一個形態。</p>
    </div>
    <div class="fx-boundary">ABOUT / 形態切換分界</div>
    <div class="fx-field-part">
      <h2>Another<br />point of view.</h2>
      <p>反向捲回即可恢復第一組流形。</p>
    </div>
  </div>
  <button class="fx-action fx-top-action" data-morph>切換形態</button
  ><span class="fx-render-status" data-render-status>正在建立畫面…</span>
</section>
