<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>三尺度影像立方體公轉</title>
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./demos/orbit-cubes/effect.css" />
  </head>
  <body>
    <main>
      <h1>三尺度影像立方體公轉</h1>
      <p>大、中、小圖片方塊分別自轉，整組繞共同軸心轉動。</p>
      <section class="fx-orbit-cubes" data-effect-root aria-label="三尺度影像立方體公轉展示">
        <h2>WORKS</h2>
        <div class="fx-orbit" data-orbit></div>
        <p>3 個尺度。各自自轉。<br />共享一個緩慢公轉的空間。</p>
      </section>
      <p class="package-status" role="status">可操作範例</p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
