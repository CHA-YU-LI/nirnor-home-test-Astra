<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>影片封面點擊播放</title>
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./demos/video-reveal/effect.css" />
  </head>
  <body>
    <main>
      <h1>影片封面點擊播放</h1>
      <p>封面上的圓形播放鍵消失，影片與原生控制列接手。</p>
      <section class="fx-video-reveal" data-effect-root aria-label="影片封面點擊播放展示">
        <h2>A moment in motion.</h2>
        <div class="fx-video-window">
          <video
            src="./assets/motion-study.webm"
            controls
            playsinline
            muted
            preload="metadata"
            aria-label="自製幾何形體短片"
          ></video>
          <div class="fx-video-cover" data-cover data-art="2"></div>
          <button class="fx-video-play" data-play aria-label="播放展示影片">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="1em"
              height="1em"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
              focusable="false"
            >
              <path d="m8 5 11 7-11 7Z" />
            </svg>
          </button>
        </div>
        <p class="fx-video-caption" data-video-status role="status">自製短片 / 點擊封面開始播放</p>
      </section>
      <p class="package-status" role="status">可操作範例</p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
