<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>影像邊緣拉伸揭露</title>
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./demos/pixel-stretch/effect.css" />
  </head>
  <body>
    <main>
      <h1>影像邊緣拉伸揭露</h1>
      <p>從左向右還原圖片，尚未揭露的區域延展當前掃描列的顏色。</p>
      <section class="fx-pixel-stretch" data-effect-root aria-label="影像邊緣拉伸揭露展示">
        <canvas aria-hidden="true"></canvas
        ><span class="fx-stretch-label">HOVER TO REVEAL / 移入圖片</span>
      </section>
      <p class="package-status" role="status">可操作範例</p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
