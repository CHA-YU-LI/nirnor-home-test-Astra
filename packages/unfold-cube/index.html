<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>分類立方體分階段攤平</title>
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./demos/unfold-cube/effect.css" />
  </head>
  <body>
    <main>
      <h1>分類立方體分階段攤平</h1>
      <p>旋轉的圖片盒先擺正，再依鉸鏈展開，成為 6 張圖的平面組合。</p>
      <section class="fx-unfold-cube" data-effect-root aria-label="分類立方體分階段攤平展示">
        <div class="fx-scroller" data-scroller tabindex="0" role="region" aria-label="可捲動展示區">
          <div class="fx-unfold-space">慢慢往下捲動。<br />方塊跨過中線時，依序擺正與攤平。</div>
          <div class="fx-net-anchor" data-net></div>
          <div class="fx-unfold-end">回捲時保留展開狀態。<br />可用上方按鈕手動收合。</div>
        </div>
        <div class="fx-threshold"><span>TRIGGER / 50%</span></div>
        <button class="fx-action fx-top-action" data-unfold>展開 / 收合</button>
      </section>
      <p class="package-status" role="status">可操作範例</p>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
