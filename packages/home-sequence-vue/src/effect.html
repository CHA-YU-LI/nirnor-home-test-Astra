<section class="fx-home-sequence" data-effect-root aria-label="組合：首頁連續動態展示">
  <div class="fx-chaos-attractor" data-combo-field>
    <canvas aria-hidden="true"></canvas
    ><span class="fx-render-status" data-render-status>正在建立畫面…</span>
  </div>
  <div class="fx-scroller" data-scroller tabindex="0" role="region" aria-label="可捲動展示區">
    <div class="fx-combo-header">FORM / MOTION STUDIES</div>
    <section class="fx-combo-part">
      <span class="fx-combo-logo" data-blink>form.</span>
      <h2 data-blink>less noise.<br />more feeling.</h2>
      <p data-blink>向下捲動，觀察不同效果如何共享同一段動態關係。</p>
    </section>
    <section class="fx-orbit-cubes" data-combo-cubes>
      <h2>WORKS</h2>
      <div class="fx-orbit" data-orbit></div>
    </section>
    <section class="fx-combo-category" data-combo-category>
      <h2>art direction</h2>
      <p>立方體在進入畫面後，攤平為影像組合。</p>
      <div class="fx-unfold-cube" data-combo-unfold><div class="fx-net-anchor" data-net></div></div>
    </section>
    <section class="fx-combo-part" data-combo-about>
      <h2 data-blink>eloquent<br />silence.</h2>
      <p>跨過 About 分界時，背景粒子轉換到另一組流形。往回捲動，形態便隨之復原。</p>
    </section>
  </div>
</section>
